appId: com.logbook.app
productName: LOGBOOK
copyright: Personal use
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - "!dist-electron/*.map"
  - package.json
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: LOGBOOK
  artifactName: LOGBOOK-Setup-${version}.exe
